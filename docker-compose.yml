services:
  db:
    build: ./infra/postgres
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD}@db:5432/market
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD}@db:5432/market
      REDIS_URL: redis://redis:6379/0
      # Celery beat owns polling/analysis; the API keeps the WebSocket ingestor and the /ws fan-out.
      CELERY_ENABLED: "true"
      # Requests reach the container from the Docker bridge, not loopback: administration needs ADMIN_TOKEN here.
      ADMIN_AUTH: token
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      retries: 5
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD}@db:5432/market
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    command: ["celery", "-A", "backend.workers:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "celery", "-A", "backend.workers:celery_app", "inspect", "ping", "--timeout=5"]
      interval: 30s
      retries: 5
  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD}@db:5432/market
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    # Schedule built from config/rules.d/refresh.json (backend.workers.beat_schedule).
    command: ["celery", "-A", "backend.workers:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat"]
    depends_on:
      worker: {condition: service_started}
  web:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
