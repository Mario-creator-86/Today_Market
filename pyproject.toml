[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.28,<1", "redis>=5,<7", "celery>=5.4,<6", "psycopg[binary]>=3.2,<4", "websockets>=14,<16", "exchange-calendars>=4.8,<5", "tzdata", "defusedxml>=0.7,<1", "python-dotenv>=1.2.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9", "mypy>=1.14", "types-defusedxml"]
# Web Push delivery (RFC 8291 encryption + VAPID); without it the webpush channel reports UNAVAILABLE.
notifications = ["pywebpush>=2,<3"]
# OTLP span export; without it tracing stays a no-op even when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otel = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
